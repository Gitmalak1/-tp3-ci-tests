
name: .NET Tests CI

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ./dotnet-app.Tests/ProjectFile-Tests.csproj

      - name: Run unit tests
        run: dotnet test ./dotnet-app.Tests/ProjectFile-Tests.csproj --no-restore --verbosity normal
